# Woodpecker CI for void_engine.
#
# Ported from .github/workflows/ci.yml. The structure is deliberately
# unchanged from the Actions version — same axes, same order, same
# reasoning — so the two can be diffed if anything looks wrong.
#
# Concurrency note: this instance has two agents with capacity 1 and 2, so
# three steps can run at once across the whole server. The steps below run
# sequentially within this pipeline, which is the right shape here: fanning
# the feature axes out into parallel steps would just make them queue
# against each other and against every other repo.

when:
  - event: push
    branch: main
  - event: pull_request

variables:
  # Pinned, not `rust:1`. A floating tag resolves to the newest stable,
  # which drifted three minors ahead of the development machine and broke
  # the first run on `chunks_exact_to_as_chunks` — a lint that did not
  # exist locally, firing on code nobody had touched. Pinning means CI
  # fails only on what can be reproduced locally; bump this deliberately
  # to take a newer compiler and its new lints at a chosen moment.
  - &rust_image rust:1.95
  # Warnings are failures in CI but not in a local `cargo build`, so a work
  # in progress stays comfortable while `main` stays clean.
  - &cargo_env
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

steps:
  # `audio` pulls rodio -> alsa-sys, which needs pkg-config and ALSA
  # headers. Installing them here keeps the default feature set (the one
  # games actually build with) under test rather than only the headless
  # subset.
  #
  # Unlike Actions there is no rust-cache equivalent; each step starts from
  # a clean container, so the deps install lives in every step that needs
  # it rather than in a setup step of its own.
  - name: check
    image: *rust_image
    environment: *cargo_env
    commands:
      - apt-get update && apt-get install -y libasound2-dev pkg-config
      - rustup component add clippy

      # No `cargo fmt --check` step on purpose. This codebase is hand-aligned
      # (struct fields in columns, compact single-line literals) and rustfmt
      # would rewrite ~586 sites across the tree. Adopting it is a defensible
      # call, but it belongs in its own commit — not smuggled in as a CI gate
      # that turns `main` red on day one.

      # The feature axes that change what compiles. `net` gates the whole
      # netcode module; headless consumers build without `audio`; `persist`
      # turns on serde derives across components, the registry and
      # snapshot/restore; `ledger` implies `persist` but is the only axis
      # that compiles the ledger module; `ledger-pg` adds the writer thread
      # and driver; `admin` is the operator status page; `replication` is
      # the only axis with `net` and `persist` on together; `render3d` is
      # the only axis that compiles the 3D renderer. Each compiles
      # something no other axis does — drop one and that module goes
      # unchecked.
      #
      # `render3d` was missing for the whole of the 3D work and was added
      # after the fact: five modules and two shaders went through six
      # commits checked only on a developer machine. The rule above is
      # what should have caught it, so it is restated here — a new feature
      # needs an axis in the same commit that adds the feature.
      - cargo clippy --all-targets -- -D warnings
      - cargo clippy --all-targets --features net -- -D warnings
      - cargo clippy --all-targets --no-default-features -- -D warnings
      - cargo clippy --all-targets --no-default-features --features persist -- -D warnings
      - cargo clippy --all-targets --no-default-features --features ledger -- -D warnings
      - cargo clippy --all-targets --no-default-features --features ledger-pg -- -D warnings
      - cargo clippy --all-targets --no-default-features --features admin -- -D warnings
      - cargo clippy --all-targets --no-default-features --features replication -- -D warnings
      # `render3d` is the only axis that compiles mesh3d, render3d,
      # shadow3d, their two WGSL shaders and the two GPU test suites.
      # Its tests skip themselves without an adapter, so on a headless
      # runner this proves the axis compiles and its non-GPU unit tests
      # pass — which is what catches a broken cfg, a stale vertex layout
      # or a doc link into a module no other axis builds.
      - cargo clippy --all-targets --features render3d -- -D warnings

      # Intra-doc links, on every axis, for the same reason clippy runs on
      # every axis: a link resolves or not depending on which modules the
      # feature set compiled. One broken link sat in `net/mod.rs` from
      # 7ac5124 pointing at `replication::`, which exists on the axis that
      # gates it and nowhere else — a single-axis doc step would have
      # missed it exactly as no doc step did.
      #
      # `RUSTDOCFLAGS: -D warnings` is load-bearing. Plain `cargo doc`
      # exits 0 on a broken link (measured), so without it these steps
      # would render HTML and report success while checking nothing.
      - export RUSTDOCFLAGS="-D warnings"
      - cargo doc --no-deps
      - cargo doc --no-deps --features net
      - cargo doc --no-deps --no-default-features
      - cargo doc --no-deps --no-default-features --features persist
      - cargo doc --no-deps --no-default-features --features ledger
      - cargo doc --no-deps --no-default-features --features ledger-pg
      - cargo doc --no-deps --no-default-features --features admin
      - cargo doc --no-deps --no-default-features --features replication
      - cargo doc --no-deps --features render3d
      - unset RUSTDOCFLAGS

      - cargo test --all-targets
      - cargo test --all-targets --features net
      - cargo test --all-targets --no-default-features
      - cargo test --all-targets --no-default-features --features persist
      - cargo test --all-targets --no-default-features --features ledger
      # Without VOID_ENGINE_PG_URL the durable tests skip themselves, so
      # this still proves the axis compiles and its in-memory tests pass.
      # The database-backed run is the `ledger-pg` step below.
      - cargo test --all-targets --no-default-features --features ledger-pg
      - cargo test --all-targets --no-default-features --features replication
      # The admin page binds real loopback sockets in its tests, on port 0
      # so parallel runs cannot collide.
      - cargo test --all-targets --no-default-features --features admin
      - cargo test --all-targets --features render3d

      # `--all-targets` does NOT run doctests, so every `cargo test` step
      # above skips them. The admin module's examples are the only
      # documentation of how a game calls `expire_reservations` and
      # `audit_zero_sum` — the page cannot, by design — so an example that
      # stops compiling takes the guidance with it silently.
      - cargo test --doc --no-default-features --features admin
      - cargo test --doc

  # Count assertions. Each of these suites lives behind a cfg gate, and a
  # gate that breaks makes the suite vanish while every step above still
  # passes. Asserting the count is what turns "compiled" into "ran".
  #
  # These greps fail when the count goes UP as well as down, so adding a
  # test means bumping the number here. Two had already drifted when this
  # file was ported from Actions (replication 21->23, bitpack 13->16);
  # the numbers below are measured against the tree, not copied.
  - name: tests-actually-ran
    image: *rust_image
    environment: *cargo_env
    commands:
      - apt-get update && apt-get install -y libasound2-dev pkg-config

      # `Replicate` is the axis that says what reaches a client, and its
      # default is "nothing". A regression that silently flipped that
      # default, or dropped the cfg on these tests, would leak component
      # state to every nearby player without failing anything else.
      - |
        out=$(cargo test --lib --no-default-features --features persist persist::registry::replicate_tests:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "6 passed" || {
          echo "expected 6 replicate-classification tests; the cfg gate may be wrong"
          exit 1
        }

      # The replication module lives behind a two-feature gate, which is an
      # easy shape to get subtly wrong: with a bad `cfg` it simply vanishes
      # and every step above still passes.
      - |
        out=$(cargo test --lib --no-default-features --features replication net::replication:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "23 passed" || {
          echo "expected 23 replication tests; the cfg gate may be wrong"
          exit 1
        }

      # The chunker's escalation policy plus the capacity hint. These
      # encode a production incident (1,325 entities dropped in 44
      # seconds) as executable assertions, so losing them silently would
      # cost more than most: the failure they guard against is invisible
      # until it is in front of players.
      - |
        out=$(cargo test --lib --features net net::chunk:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "19 passed" || {
          echo "expected 19 chunking tests; the cfg gate may be wrong"
          exit 1
        }

      # Ray picking and the 3D grid traversal it drives. Neither is
      # feature-gated; the risk is the same as physics3d's — a shrinking
      # suite. Both encode properties that are wrong invisibly: an
      # unprojection missing its Y flip picks a vertically mirrored
      # world, and a DDA missing its third branch simply never reaches
      # diagonal targets.
      - |
        out=$(cargo test --lib pick3d:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "22 passed" || {
          echo "expected 22 picking tests"
          exit 1
        }
      - |
        out=$(cargo test --lib collision::narrow3d:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "24 passed" || {
          echo "expected 24 3D narrowphase tests"
          exit 1
        }
      - |
        out=$(cargo test --lib collision::grid3d:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "19 passed" || {
          echo "expected 19 3D grid tests"
          exit 1
        }

      # The rigid-body solver. Not feature-gated, so a broken cfg is not
      # the risk here — the risk is the suite quietly shrinking, because
      # almost every test in it encodes a physical property that is wrong
      # in a way nobody notices from a screenshot: gravity that scales
      # with mass, friction that is unbounded, a body that never sleeps.
      - |
        out=$(cargo test --lib physics3d:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "40 passed" || {
          echo "expected 40 rigid-body tests"
          exit 1
        }

      # The 3D renderer's unit tests, all behind `#[cfg(feature =
      # "render3d")]`. A broken gate makes every one of them vanish while
      # `cargo test --features render3d` still reports success, because
      # there is nothing left to fail. Counting is what distinguishes
      # "compiled and ran" from "compiled away".
      #
      # Counts the whole `renderer::` tree rather than each 3D module,
      # because the 2D renderer has no unit tests of its own — every hit
      # here is 3D. The GPU-backed suites in tests/ are separate and skip
      # themselves without an adapter.
      - |
        out=$(cargo test --lib --features render3d renderer:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "33 passed" || {
          echo "expected 33 renderer tests; the render3d cfg gate may be wrong"
          exit 1
        }

      # The wire format's round-trip properties. These are the tests that
      # fail when an encoder change silently desyncs the two ends.
      - |
        out=$(cargo test --lib --no-default-features --features replication net::bitpack:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "16 passed" || {
          echo "expected 16 bit-packing tests; the cfg gate may be wrong"
          exit 1
        }

      # The packet that ties the rest together. `the_name_table_rides_only_
      # the_first_chunk` is the guard against re-cloning a bulk header into
      # every chunk — the production bug `chunk` exists to prevent.
      #
      # Filters are `::`-qualified deliberately. A bare `snapshot` also
      # matches four `net::interp` tests, so the count would silently
      # depend on an unrelated module's test total.
      - |
        out=$(cargo test --lib --no-default-features --features replication net::snapshot:: 2>&1)
        echo "$out"
        echo "$out" | grep -q "15 passed" || {
          echo "expected 15 snapshot-packet tests; the cfg gate may be wrong"
          exit 1
        }

      # The only test that proves the replication pieces *compose*: a grid
      # index surviving the trip to an entity id, a client reconstructing
      # from the wire exactly what the server believed it could see, and
      # both holding as entities move in and out of range across ticks.
      # Unit tests on either side of a seam cannot see a disagreement
      # about the seam itself, which is what this catches.
      - |
        out=$(cargo test --test replication_e2e --no-default-features --features replication 2>&1)
        echo "$out"
        echo "$out" | grep -q "6 passed" || {
          echo "expected 6 end-to-end replication tests; the cfg gate may be wrong"
          exit 1
        }

      # Phase 1 and 2's exit criteria both live only on this axis: without
      # `persist` these files compile to empty binaries.
      - |
        out=$(cargo test --test snapshot_round_trip --no-default-features --features persist 2>&1)
        echo "$out"
        echo "$out" | grep -q "16 passed" || {
          echo "expected 16 snapshot round-trip tests; the cfg gate may be wrong"
          exit 1
        }

      - |
        out=$(cargo test --test crash_recovery --no-default-features --features persist 2>&1)
        echo "$out"
        echo "$out" | grep -q "4 passed" || {
          echo "expected 4 crash-recovery tests; the cfg gate may be wrong"
          exit 1
        }

      - |
        out=$(cargo test --test ledger_properties --no-default-features --features ledger 2>&1)
        echo "$out"
        echo "$out" | grep -q "4 passed" || {
          echo "expected 4 ledger property tests; the cfg gate may be wrong"
          exit 1
        }

      # R1's central claim, asserted rather than assumed: a headless build
      # links no GPU stack. `-e normal` excludes dev-dependencies, so the
      # `naga` used by the shader test does not count — a downstream server
      # never builds those.
      - |
        if cargo tree -e normal --no-default-features | grep -qiE '(^|[^-])wgpu'; then
          echo "wgpu present in a headless build; the client feature is leaking"
          cargo tree -e normal --no-default-features | grep -iE 'wgpu|naga'
          exit 1
        fi
        echo "confirmed: no wgpu in the headless dependency graph"

  # Woodpecker services have no health-check equivalent to the Actions
  # `options: --health-cmd`, so the wait loop is explicit. Without it the
  # step races the container's startup and fails intermittently, which is
  # worse than failing consistently.
  #
  # The service is reachable by its name on the pipeline network, so the
  # host is `postgres` rather than Actions' `127.0.0.1` port mapping.
  - name: ledger-pg
    image: *rust_image
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      VOID_ENGINE_PG_URL: "host=postgres port=5432 user=postgres password=devpw dbname=void_engine"
    commands:
      - apt-get update && apt-get install -y libasound2-dev pkg-config postgresql-client
      - |
        for i in $(seq 1 60); do
          pg_isready -h postgres -U postgres && break
          sleep 1
        done

      # The tests skip themselves when the URL is unset, so a
      # misconfigured environment would look like a pass. Assert they
      # actually ran.
      #
      # Both counts verified against a real postgres:17-alpine, not
      # assumed: 8 and 4 as asserted.
      - |
        out=$(cargo test --test ledger_pg --no-default-features --features ledger-pg 2>&1)
        echo "$out"
        echo "$out" | grep -q "8 passed" || {
          echo "expected 8 durable ledger tests; they may have skipped"
          exit 1
        }

      # The crash matrix needs only a connection string, not control of
      # the container, so unlike the outage tests it runs fine against a
      # service container.
      - |
        out=$(cargo test --test crash_matrix --no-default-features --features ledger-pg -- --test-threads=1 2>&1)
        echo "$out"
        echo "$out" | grep -q "4 passed" || {
          echo "expected 4 crash-matrix tests; they may have skipped"
          exit 1
        }

  # `benches/hot_paths.rs` exits non-zero when a measured path blows its
  # budget, so this step is the regression gate. Headless plus
  # `replication`: the guards cover ECS, collision, area-of-interest and
  # snapshot encoding, none of which needs audio or a GPU — but the
  # encode guard names `net::snapshot`, so without the feature it would
  # compile out and silently stop guarding anything.
  #
  # Runner variance is real; the budgets are ~3x the recorded baseline so
  # only an algorithmic regression trips them, not a noisy neighbour.
  # Woodpecker shares agents across repos, so expect more variance here
  # than on a dedicated Actions runner.
  - name: perf
    image: *rust_image
    environment: *cargo_env
    commands:
      - apt-get update && apt-get install -y libasound2-dev pkg-config
      - cargo bench --no-default-features --features replication

  # These three tests stop and start Postgres mid-flight, so unlike
  # `ledger-pg` they cannot use a service container: a service cannot be
  # controlled from inside the step. This one owns its own container, which
  # means reaching the host docker daemon through the mounted socket.
  #
  # That mount requires Trusted -> Volumes in this repo's Woodpecker
  # settings. It is a real privilege grant — a step that can reach the host
  # docker socket can do anything to that host — and it is on deliberately.
  #
  # Networking differs from the Actions version in a way that matters. There
  # the job ran directly on the runner VM, so `-p 55432:5432` published into
  # the same namespace as the test process and `127.0.0.1` reached it. Here
  # the step is itself a container, so its loopback is its own: the database
  # is addressed by container name over a shared docker network instead, and
  # the published port is dropped as useless.
  - name: ledger-outage
    image: *rust_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      VOID_ENGINE_PG_URL: "host=ve_pg_ci port=5432 user=postgres password=devpw dbname=void_engine"
      VOID_ENGINE_PG_CONTAINER: ve_pg_ci
    commands:
      # `docker-cli` only. The `docker.io` package pulls a daemon this step
      # has no use for — it drives the host's through the socket.
      - apt-get update && apt-get install -y libasound2-dev pkg-config docker-cli || apt-get install -y libasound2-dev pkg-config docker.io
      # A dedicated network so this step's container and the database can
      # resolve each other by name. `|| true` because a previous run that
      # died between creating the network and removing it would otherwise
      # fail here on "already exists".
      - docker network create ve_ci_net || true
      - docker rm -f ve_pg_ci || true
      - |
        docker run -d --name ve_pg_ci --network ve_ci_net \
          -e POSTGRES_PASSWORD=devpw -e POSTGRES_DB=void_engine \
          postgres:17-alpine
        docker network connect ve_ci_net "$(hostname)" || true
        for i in $(seq 1 60); do
          docker exec ve_pg_ci pg_isready -U postgres && break
          sleep 1
        done
      - |
        out=$(cargo test --test ledger_outage --no-default-features --features ledger-pg -- --test-threads=1 2>&1)
        echo "$out"
        # They skip themselves when the env is unset, so a misconfigured
        # step would look like a pass. Assert they actually ran.
        #
        # Verified against a real container (3 as asserted), so a
        # disagreement here means the cfg gate, not a stale number.
        echo "$out" | grep -q "3 passed" || {
          echo "expected 3 outage tests; they may have skipped"
          exit 1
        }

  # Actions had this as an `if: always()` step. Woodpecker's equivalent is a
  # step that runs on failure and cannot itself fail the pipeline. Without
  # it a failed test leaks `ve_pg_ci`, and every later run then dies at
  # `docker run` on the name collision — a single red build turning into a
  # permanently red pipeline.
  - name: ledger-outage-cleanup
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      status: [success, failure]
    failure: ignore
    commands:
      - docker rm -f ve_pg_ci || true
      - docker network rm ve_ci_net || true

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: void_engine
