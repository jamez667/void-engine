name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures in CI but not in a local `cargo build`, so a work
  # in progress stays comfortable while `main` stays clean.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `audio` pulls rodio -> alsa-sys, which needs pkg-config and ALSA
      # headers. Installing them here keeps the default feature set (the one
      # games actually build with) under test rather than only the headless
      # subset.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # No `cargo fmt --check` step on purpose. This codebase is hand-aligned
      # (struct fields in columns, compact single-line literals) and rustfmt
      # would rewrite ~586 sites across the tree. Adopting it is a defensible
      # call, but it belongs in its own commit — not smuggled in as a CI gate
      # that turns `main` red on day one.
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # The two feature axes that change what compiles: `net` gates the whole
      # netcode module, and headless consumers build without `audio`.
      - name: Clippy (net)
        run: cargo clippy --all-targets --features net -- -D warnings

      - name: Clippy (headless)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      # `persist` is a third feature axis: it turns on serde derives across
      # `components`, the component registry and snapshot/restore. None of
      # that is compiled by the other three, so without this step the whole
      # module is unchecked.
      - name: Clippy (persist)
        run: cargo clippy --all-targets --no-default-features --features persist -- -D warnings

      # Tier 3. `ledger` implies `persist`, so this axis is a superset —
      # but the ledger module only compiles here, so without this step it
      # is entirely unchecked.
      - name: Clippy (ledger)
        run: cargo clippy --all-targets --no-default-features --features ledger -- -D warnings

      # Tier 3 with Postgres. Compiles the writer thread and the driver,
      # which no other axis does.
      - name: Clippy (ledger-pg)
        run: cargo clippy --all-targets --no-default-features --features ledger-pg -- -D warnings

      # `replication` is the only axis where `net` and `persist` are on
      # together. Neither of their own axes compiles this module: `net`
      # builds with persist *off*, and `persist` has no netcode. Without
      # this step it is unchecked.
      - name: Clippy (replication)
        run: cargo clippy --all-targets --no-default-features --features replication -- -D warnings

      - name: Test (default features)
        run: cargo test --all-targets

      - name: Test (net)
        run: cargo test --all-targets --features net

      - name: Test (headless)
        run: cargo test --all-targets --no-default-features

      - name: Test (persist)
        run: cargo test --all-targets --no-default-features --features persist

      - name: Test (ledger)
        run: cargo test --all-targets --no-default-features --features ledger

      # Without VOID_ENGINE_PG_URL the durable tests skip themselves, so
      # this still proves the axis compiles and its in-memory tests pass.
      # The database-backed run is the `ledger-pg` job below.
      - name: Test (ledger-pg, no database)
        run: cargo test --all-targets --no-default-features --features ledger-pg

      - name: Test (replication)
        run: cargo test --all-targets --no-default-features --features replication

      # `Replicate` is the axis that says what reaches a client, and its
      # default is "nothing". A regression that silently flipped that
      # default, or dropped the cfg on these tests, would leak component
      # state to every nearby player without failing anything else.
      - name: Replicate classification actually ran
        run: |
          out=$(cargo test --lib --no-default-features --features persist persist::registry::replicate_tests:: 2>&1)
          echo "$out"
          echo "$out" | grep -q "6 passed" || {
            echo "expected 6 replicate-classification tests; the cfg gate may be wrong"
            exit 1
          }

      # The replication module lives behind a two-feature gate, which is a
      # new shape in this tree and an easy one to get subtly wrong: with a
      # bad `cfg` it simply vanishes and every step above still passes.
      # Assert the count, the same way the persist-only suites do.
      - name: Replication actually ran
        run: |
          out=$(cargo test --lib --no-default-features --features replication net::replication:: 2>&1)
          echo "$out"
          echo "$out" | grep -q "16 passed" || {
            echo "expected 16 replication tests; the cfg gate may be wrong"
            exit 1
          }

      # The wire format's round-trip properties. These are the tests that
      # fail when an encoder change silently desyncs the two ends, so a
      # cfg regression that stopped running them would be expensive.
      - name: Bit packing actually ran
        run: |
          out=$(cargo test --lib --no-default-features --features replication net::bitpack:: 2>&1)
          echo "$out"
          echo "$out" | grep -q "13 passed" || {
            echo "expected 13 bit-packing tests; the cfg gate may be wrong"
            exit 1
          }

      # The packet that ties the rest together. `the_name_table_rides_only_
      # the_first_chunk` is the guard against re-cloning a bulk header into
      # every chunk — the production bug `chunk` exists to prevent, which
      # cost 1,325 dropped entities in 44 seconds.
      #
      # Filters are `::`-qualified deliberately. A bare `snapshot` also
      # matches four `net::interp` tests, so the count would silently
      # depend on an unrelated module's test total.
      - name: Snapshot packet actually ran
        run: |
          out=$(cargo test --lib --no-default-features --features replication net::snapshot:: 2>&1)
          echo "$out"
          echo "$out" | grep -q "12 passed" || {
            echo "expected 12 snapshot-packet tests; the cfg gate may be wrong"
            exit 1
          }

      # Phase 1 and 2's exit criteria both live only on this axis: without
      # `persist` these files compile to empty binaries. Asserting the
      # counts stops a broken cfg gate silently turning either into a no-op
      # that reports success while testing nothing.
      - name: Snapshot round-trip actually ran
        run: |
          out=$(cargo test --test snapshot_round_trip --no-default-features --features persist 2>&1)
          echo "$out"
          echo "$out" | grep -q "10 passed" || {
            echo "expected 10 snapshot round-trip tests; the cfg gate may be wrong"
            exit 1
          }

      - name: Crash recovery actually ran
        run: |
          out=$(cargo test --test crash_recovery --no-default-features --features persist 2>&1)
          echo "$out"
          echo "$out" | grep -q "4 passed" || {
            echo "expected 4 crash-recovery tests; the cfg gate may be wrong"
            exit 1
          }

      - name: Ledger properties actually ran
        run: |
          out=$(cargo test --test ledger_properties --no-default-features --features ledger 2>&1)
          echo "$out"
          echo "$out" | grep -q "4 passed" || {
            echo "expected 4 ledger property tests; the cfg gate may be wrong"
            exit 1
          }

      # R1's central claim, asserted rather than assumed: a headless build
      # links no GPU stack. `-e normal` excludes dev-dependencies, so the
      # `naga` used by the shader test does not count — a downstream server
      # never builds those.
      - name: Headless build links no wgpu
        run: |
          if cargo tree -e normal --no-default-features | grep -qiE '(^|[^-])wgpu'; then
            echo "wgpu present in a headless build; the client feature is leaking"
            cargo tree -e normal --no-default-features | grep -iE 'wgpu|naga'
            exit 1
          fi
          echo "confirmed: no wgpu in the headless dependency graph"

  ledger-pg:
    name: durable ledger vs postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: void_engine
        ports:
          - 5432:5432
        # Without this the job races the container's startup and fails
        # intermittently, which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test against a real database
        env:
          VOID_ENGINE_PG_URL: "host=127.0.0.1 port=5432 user=postgres password=devpw dbname=void_engine"
        run: cargo test --test ledger_pg --no-default-features --features ledger-pg

      # The tests skip themselves when the URL is unset, so a
      # misconfigured environment would look like a pass. Assert they
      # actually ran.
      # The crash matrix needs only a connection string, not control of
      # the container, so unlike the outage tests it runs fine against a
      # service container.
      - name: Crash matrix
        env:
          VOID_ENGINE_PG_URL: "host=127.0.0.1 port=5432 user=postgres password=devpw dbname=void_engine"
        run: |
          out=$(cargo test --test crash_matrix --no-default-features --features ledger-pg -- --test-threads=1 2>&1)
          echo "$out"
          echo "$out" | grep -q "4 passed" || {
            echo "expected 4 crash-matrix tests; they may have skipped"
            exit 1
          }

      - name: The durable tests actually ran
        env:
          VOID_ENGINE_PG_URL: "host=127.0.0.1 port=5432 user=postgres password=devpw dbname=void_engine"
        run: |
          out=$(cargo test --test ledger_pg --no-default-features --features ledger-pg 2>&1)
          echo "$out"
          echo "$out" | grep -q "8 passed" || {
            echo "expected 8 durable ledger tests; they may have skipped"
            exit 1
          }

  ledger-outage:
    name: ledger survives a database outage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Not a `services:` container: these tests stop and start the
      # database mid-flight, and a service container cannot be controlled
      # from inside the job. This one owns its own docker.
      - name: Start postgres
        run: |
          docker run -d --name ve_pg_ci             -e POSTGRES_PASSWORD=devpw -e POSTGRES_DB=void_engine             -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 60); do
            docker exec ve_pg_ci pg_isready -U postgres && break
            sleep 1
          done

      - name: Outage behaviour
        env:
          VOID_ENGINE_PG_URL: "host=127.0.0.1 port=55432 user=postgres password=devpw dbname=void_engine"
          VOID_ENGINE_PG_CONTAINER: ve_pg_ci
        run: |
          out=$(cargo test --test ledger_outage --no-default-features --features ledger-pg -- --test-threads=1 2>&1)
          echo "$out"
          # They skip themselves when the env is unset, so a misconfigured
          # job would look like a pass. Assert they actually ran.
          echo "$out" | grep -q "3 passed" || {
            echo "expected 3 outage tests; they may have skipped"
            exit 1
          }

      - name: Stop postgres
        if: always()
        run: docker rm -f ve_pg_ci || true

  perf:
    name: hot-path budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `benches/hot_paths.rs` exits non-zero when a measured path blows its
      # budget, so this step is the regression gate. Headless: the guards
      # cover ECS and collision, neither of which needs audio.
      #
      # Runner variance is real; the budgets are ~3x the recorded baseline so
      # only an algorithmic regression trips them, not a noisy neighbour.
      - name: Hot-path guards
        run: cargo bench --no-default-features
