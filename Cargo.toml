[package]
name = "void_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "22"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"], optional = true }
serde = { version = "1", features = ["derive"] }

# ── netcode (feature `net`, off by default) ──────────────────────────────────
# All optional for the same reason `rodio` is: a single-player game must not
# link a QUIC stack or the threads and attack surface that come with it.
# `cargo tree` confirms quinn, rcgen and tokio are absent with `net` off;
# rustls/ring/webpki-roots are already in every build via `ureq`, so gating
# them buys nothing but the feature flags stay accurate.
#
# Versions are pinned to match void-claim's workspace so a game can share
# types across engine and its own server crates without two incompatible
# copies of quinn/rustls in the tree.
#
# tokio: `io-util` ONLY — `framing` needs `AsyncReadExt`/`AsyncWriteExt` and
# nothing else. The runtime, timers and sockets belong to whoever drives the
# connection, so the engine does not choose them; quinn pulls in what it needs.
tokio  = { version = "1", default-features = false, features = ["io-util"], optional = true }
quinn  = { version = "0.11", optional = true }
# `ring` rather than aws-lc-rs: it is the provider void-claim ships and it
# builds without cmake/nasm, which matters for a Windows dev checkout.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# Self-signed certs for dev/LAN servers only (`CertSource::SelfSignedDev`).
# Real deployments hand in their own cert, but leaving this out would mean no
# `cargo run` server at all.
rcgen  = { version = "0.13", optional = true }
# Trust anchors for the *verifying* client config — the default path. Pure
# data, no C toolchain, and unlike reading the platform store it behaves the
# same on every OS the engine targets.
webpki-roots = { version = "0.26", optional = true }

[features]
# Audio is client-only. Headless consumers (servers, simulation) link this
# crate purely for its ECS + math, so they take it with
# `default-features = false`; that keeps `rodio` (and thus `alsa-sys`, which
# needs pkg-config and libasound2-dev) out of headless Docker images
# entirely. Clients opt back in with `features = ["audio"]`.
default = ["audio"]
audio = ["dep:rodio"]

# Networking is opt-in for the same reason audio is: a game that has no
# netcode should not carry the code, the threads, or the attack surface of a
# transport it never opens. Single-player games (mini-miner-2) and headless
# consumers take the engine without this and the `net` module vanishes
# entirely. Off by default because most games built on this engine are
# single-player; multiplayer ones opt in with `features = ["net"]`.
net = ["dep:tokio", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:webpki-roots"]

[workspace]
# Standalone crate: an empty workspace table stops Cargo walking up to a
# parent workspace if this repo is ever checked out inside one.

# Debug builds: optimize deps fully, engine code lightly — carried over from
# the void-claim workspace so unoptimized runs stay usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
naga = { version = "22", features = ["wgsl-in"] }
pollster = "0.4"
bytemuck = "1"
