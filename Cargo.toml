[package]
name = "void_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wgpu` is client-only (feature `client`, on by default). A dedicated
# server links this crate for its ECS, math, collision and netcode and has
# no business carrying a GPU stack: it is a large dependency tree, and on a
# headless Linux box the system libraries it expects are absent. Gating it
# is what makes the README's "headless consumers" claim actually true —
# before this, `default-features = false` still built wgpu.
wgpu = { version = "22", optional = true }
# `winit` stays unconditional, deliberately. It supplies `KeyCode` and
# `MouseButton`, which `input`/`keybinds` use as plain data — a `KeyCode` is
# a field-less enum used as a bitset index, with no window attached — and a
# server that replays recorded input, or reloads a player's keybinds, still
# needs to name keys. Gating it would mean either duplicating that enum or
# making `input` client-only, and a headless replay harness genuinely wants
# it. It is pure Rust and opens nothing on its own: the OS windowing
# libraries are loaded by creating a window, which a server never does.
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"], optional = true }
serde = { version = "1", features = ["derive"] }
# Checkpoint encoding (feature `persist`). A binary format, not JSON: a
# checkpoint is machine-read on a hot restart path and never hand-edited,
# so size and decode speed beat readability. bincode rather than postcard
# only because it is already vendored in this checkout, and the format is
# an implementation detail behind `Snapshot` either way.
bincode = { version = "1", optional = true }

# ── netcode (feature `net`, off by default) ──────────────────────────────────
# All optional for the same reason `rodio` is: a single-player game must not
# link a QUIC stack or the threads and attack surface that come with it.
# `cargo tree` confirms quinn, rcgen and tokio are absent with `net` off;
# rustls/ring/webpki-roots are already in every build via `ureq`, so gating
# them buys nothing but the feature flags stay accurate.
#
# Versions are pinned to match void-claim's workspace so a game can share
# types across engine and its own server crates without two incompatible
# copies of quinn/rustls in the tree.
#
# tokio: `io-util` ONLY — `framing` needs `AsyncReadExt`/`AsyncWriteExt` and
# nothing else. The runtime, timers and sockets belong to whoever drives the
# connection, so the engine does not choose them; quinn pulls in what it needs.
tokio  = { version = "1", default-features = false, features = ["io-util"], optional = true }
quinn  = { version = "0.11", optional = true }
# `ring` rather than aws-lc-rs: it is the provider void-claim ships and it
# builds without cmake/nasm, which matters for a Windows dev checkout.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# Self-signed certs for dev/LAN servers only (`CertSource::SelfSignedDev`).
# Real deployments hand in their own cert, but leaving this out would mean no
# `cargo run` server at all.
rcgen  = { version = "0.13", optional = true }
# Trust anchors for the *verifying* client config — the default path. Pure
# data, no C toolchain, and unlike reading the platform store it behaves the
# same on every OS the engine targets.
webpki-roots = { version = "0.26", optional = true }

# ── Postgres-backed ledger (feature `ledger-pg`) ────────────────────────────
# Optional for the same reason the rest is: a single-player game, and even
# an in-memory tier-3 build, must not link a database driver.
#
# tokio here needs a real runtime, unlike the `net` pin which takes
# `io-util` only. Cargo unifies the union of both feature sets, so the two
# coexist; the runtime is owned by the ledger writer thread, never by the
# simulation, because `fixed_update` is sync and must stay that way.
tokio-postgres = { version = "0.7", optional = true }
# Migrations as numbered SQL embedded in the binary — a server must be able
# to migrate itself on boot without shipping a CLI alongside it.
refinery = { version = "0.9", default-features = false, features = ["tokio-postgres"], optional = true }

[features]
# Audio is client-only. Headless consumers (servers, simulation) link this
# crate purely for its ECS + math, so they take it with
# `default-features = false`; that keeps `rodio` (and thus `alsa-sys`, which
# needs pkg-config and libasound2-dev) out of headless Docker images
# entirely. Clients opt back in with `features = ["audio"]`.
default = ["audio", "client"]
audio = ["dep:rodio"]

# The windowed client: renderer, immediate-mode UI, fx, bitmap text, the
# winit event loop, and `ClientApp`/`run`. Off means a headless build —
# `App` + `run_headless` over a `Timestep`, with no GPU and no window.
client = ["dep:wgpu"]

# Saving and loading a `World`: the component name registry, snapshot and
# restore, and RNG state capture. Off by default because a game that never
# saves should not carry an encoder or the registry's startup audit.
#
# This is tier 2 of three (see TODO.md R2): tier 1 is no persistence, tier
# 3 adds the append-only ledger and Postgres for MMO-scale value tracking.
persist = ["dep:bincode", "glam/serde"]

# Tier 3: append-only value tracking. Every movement of currency or
# items is a double-entry ledger record, and a balance is derived from
# the log rather than stored as a mutable number. This is what makes
# duping *detectable* rather than merely discouraged, and it is the
# tier an MMO needs and a single-player game does not.
#
# Implies `persist`: a ledger without checkpoints would replay its
# whole history on every boot.
ledger = ["persist"]

# Tier 3 with durability: the same ledger semantics, written through to
# Postgres by a background writer thread. Implies `ledger`, since the
# in-memory core is what the store is a backend for.
ledger-pg = [
    "ledger",
    "dep:tokio-postgres",
    "dep:refinery",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/time",
    "tokio/sync",
]

# Networking is opt-in for the same reason audio is: a game that has no
# netcode should not carry the code, the threads, or the attack surface of a
# transport it never opens. Single-player games (mini-miner-2) and headless
# consumers take the engine without this and the `net` module vanishes
# entirely. Off by default because most games built on this engine are
# single-player; multiplayer ones opt in with `features = ["net"]`.
net = ["dep:tokio", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:webpki-roots"]

# Interest-managed replication: per-client area-of-interest, baseline+delta
# snapshots, and the wire encoding for both.
#
# Implies `net` for the transport and `persist` for the component registry —
# replication names components on the wire by their registry `NameId`, which
# is the same two-byte interning a save file uses, and inventing a second
# naming scheme for the network would be the one way to let a save file and
# a packet disagree about what a component is.
#
# Separate from `net` rather than folded into it because the transport
# primitives stand alone: a game doing its own replication over `chunk` and
# `quic` should not be made to compile the registry and an encoder it will
# not call.
replication = ["net", "persist"]

[workspace]
# Standalone crate: an empty workspace table stops Cargo walking up to a
# parent workspace if this repo is ever checked out inside one.

# Debug builds: optimize deps fully, engine code lightly — carried over from
# the void-claim workspace so unoptimized runs stay usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
naga = { version = "22", features = ["wgsl-in"] }
pollster = "0.4"
bytemuck = "1"

# Hot-path regression guards. `harness = false` because these are budget
# assertions with a plain main(), not libtest micro-benchmarks; the same
# budgets are also enforced as #[test] so plain `cargo test` catches a
# regression without needing `cargo bench`.
[[bench]]
name = "hot_paths"
harness = false

# Both examples drive the renderer directly (Batch, and in material_preview a
# raw wgpu device), so they only exist in a client build.
[[example]]
name = "bubble_preview"
required-features = ["client"]

[[example]]
name = "material_preview"
required-features = ["client"]

# Both of these drive the renderer directly — one stands up a headless wgpu
# device and reads pixels back, the other parses shader.wgsl through naga.
# Neither can exist in a build without the GPU stack, so they are pinned to
# `client` rather than made to compile against a renderer that is not there.
[[test]]
name = "materials_render"
required-features = ["client"]

[[test]]
name = "shader_compiles"
required-features = ["client"]
